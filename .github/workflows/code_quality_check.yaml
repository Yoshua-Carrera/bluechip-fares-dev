name: Code quality check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  code_quality_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: node --version
      - run: pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run pretty
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run check-types
